services:
  # Servizio Principale: Orchestratore Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: slm-orchestrator:latest
    container_name: slm-orchestrator-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - ROUTER_TYPE=${ROUTER_TYPE:-local-ollama}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
        required: false
      ollama:
        condition: service_healthy
        required: false
    networks:
      - slmnet

  # Servizio Frontend: Single Page Application Angular servita con Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: slm-orchestrator-frontend:latest
    container_name: slm-orchestrator-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - app
    networks:
      - slmnet

  # Motore SLM / LLM locale Ollama
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: slm-orchestrator-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # Condivide la directory dati nativa di Ollama indicata dal Makefile.
      - ${OLLAMA_DATA_DIR:-./.ollama}:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - slmnet

  # Sidecar one-shot per il download dei modelli locali (generativo + decisionale)
  ollama-init:
    image: docker.io/curlimages/curl:latest
    container_name: slm-orchestrator-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_BASE_MODEL=${OLLAMA_BASE_MODEL:-qwen2.5:3b-instruct-q8_0}
      - OLLAMA_REFLEX_MODEL=${OLLAMA_REFLEX_MODEL:-hf.co/apus-ailab/APUS-Reflex-4B-GGUF:Q4_K_M}
    entrypoint:
      - "sh"
      - "-c"
      - |
        set -eu
        model_present() {
          curl -fsS -o /dev/null \
            -X POST "$$OLLAMA_BASE_URL/api/show" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$$1\"}"
        }
        ensure_model() {
          model="$$1"
          if model_present "$$model"; then
            echo "Modello già disponibile: $$model"
          else
            echo "Download modello: $$model"
            curl -fsS "$$OLLAMA_BASE_URL/api/pull" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$$model\", \"stream\":false}"
          fi
        }
        echo "Pull modello generativo: $$OLLAMA_BASE_MODEL"
        ensure_model "$$OLLAMA_BASE_MODEL"
        echo "Pull modello decisionale: $$OLLAMA_REFLEX_MODEL"
        ensure_model "$$OLLAMA_REFLEX_MODEL"
        echo "Inizializzazione modelli completata."
    networks:
      - slmnet

networks:
  slmnet:
    name: slm_orchestrator_net
