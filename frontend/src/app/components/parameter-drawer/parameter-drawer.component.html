<div class="parameter-drawer-container">
  <div class="drawer-header">
    <div class="title-with-icon">
      <app-icon name="sliders" [size]="16"></app-icon>
      <span class="drawer-title">Parametri di Configurazione Richiesta</span>
    </div>
    <span class="drawer-hint">Espandi per personalizzare tipo o motore di routing</span>
  </div>

  <div class="accordion-stack">
    <!-- Sezione 1: Tipo Documento -->
    <app-accordion-item
      title="Tipo Documento"
      subtitle="Forza la tipologia attesa o lascia fare allo smistamento semantico"
      icon="file-text"
      [activeValue]="selectedDocType() || 'Auto-Detect'"
      [(isOpen)]="isDocTypeOpen"
    >
      <div class="options-grid">
        @for (opt of documentTypes; track opt.label) {
          <button
            type="button"
            class="option-card"
            [class.selected]="selectedDocType() === opt.type"
            (click)="selectDocType(opt.type)"
          >
            <div class="option-header">
              <span class="option-name">{{ opt.label }}</span>
              <app-badge [variant]="selectedDocType() === opt.type ? 'accent' : 'neutral'" size="sm">
                {{ opt.badge }}
              </app-badge>
            </div>
            <p class="option-description">{{ opt.description }}</p>
          </button>
        }
      </div>
    </app-accordion-item>

    <!-- Sezione 2: Motore Router -->
    <app-accordion-item
      title="Motore Router"
      subtitle="Seleziona il modello di classificazione ed instradamento"
      icon="cpu"
      [activeValue]="selectedRouterType() || 'Default'"
      [(isOpen)]="isRouterOpen"
    >
      <div class="options-grid">
        @for (opt of routerOptions; track opt.label) {
          <button
            type="button"
            class="option-card"
            [class.selected]="selectedRouterType() === opt.type"
            (click)="selectRouter(opt.type)"
          >
            <div class="option-header">
              <span class="option-name">{{ opt.label }}</span>
              <app-badge [variant]="selectedRouterType() === opt.type ? 'accent' : 'neutral'" size="sm">
                {{ opt.badge }}
              </app-badge>
            </div>
            <p class="option-description">{{ opt.description }}</p>
          </button>
        }
      </div>
    </app-accordion-item>
  </div>
</div>
