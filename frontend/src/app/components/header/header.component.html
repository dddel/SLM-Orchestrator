<header class="app-header">
  <div class="header-left">
    <div class="brand-badge-box">
      <app-icon name="sparkles" [size]="20" customClass="brand-icon"></app-icon>
    </div>
    <div class="brand-info">
      <div class="brand-row">
        <h1 class="brand-title">SLM Orchestrator</h1>
        <app-badge variant="accent" size="sm">Neuro-Symbolic</app-badge>
      </div>
      <p class="brand-tagline">Single Model Architecture &bull; Dynamic System Prompts &bull; Deterministic Guards</p>
    </div>
  </div>

  <div class="header-right">
    <!-- Presets Modal Open Button -->
    <button
      type="button"
      class="header-action-btn presets-btn"
      (click)="openPresetsModal.emit()"
      title="Apri catalogo esempi con esito atteso e guardie"
    >
      <app-icon name="file-text" [size]="16"></app-icon>
      <span>Esempi Predefiniti & Expected</span>
    </button>

    <!-- History button -->
    <button
      type="button"
      class="header-action-btn"
      (click)="openHistory.emit()"
      title="Cronologia esecuzioni"
    >
      <app-icon name="history" [size]="16"></app-icon>
      <span class="btn-text">Cronologia</span>
      @if (orchestratorService.history().length > 0) {
        <span class="history-count">{{ orchestratorService.history().length }}</span>
      }
    </button>

    <!-- Theme Toggle -->
    <button
      type="button"
      class="icon-toggle-btn"
      (click)="themeService.toggleTheme()"
      [title]="themeService.currentTheme() === 'dark' ? 'Passa al tema Chiaro' : 'Passa al tema Scuro'"
    >
      @if (themeService.currentTheme() === 'dark') {
        <app-icon name="sun" [size]="17"></app-icon>
      } @else {
        <app-icon name="moon" [size]="17"></app-icon>
      }
    </button>
  </div>
</header>
