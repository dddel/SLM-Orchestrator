<div class="json-viewer-card" [class.is-collapsed]="isCollapsed()">
  <div class="viewer-header">
    <button
      type="button"
      class="header-toggle-btn"
      (click)="toggleCollapse()"
      [attr.aria-expanded]="!isCollapsed()"
      title="Espandi o comprimi blocco JSON"
    >
      <app-icon
        [name]="isCollapsed() ? 'chevron-down' : 'chevron-up'"
        [size]="13"
        customClass="collapse-chevron"
      ></app-icon>
      <app-icon name="file-text" [size]="13" customClass="title-icon"></app-icon>
      <span class="viewer-title">{{ title() }}</span>
      <span class="collapsed-hint">{{ isCollapsed() ? '(compresso)' : '' }}</span>
    </button>

    <div class="viewer-actions">
      <button
        type="button"
        class="action-btn"
        (click)="copyJson()"
        [title]="isCopied() ? 'Copiato!' : 'Copia JSON negli appunti'"
        [attr.aria-label]="isCopied() ? 'Copiato' : 'Copia JSON'"
      >
        @if (isCopied()) {
          <app-icon name="check" [size]="12" customClass="text-success"></app-icon>
          <span class="btn-text text-success">Copiato</span>
        } @else {
          <app-icon name="copy" [size]="12"></app-icon>
          <span class="btn-text">Copia</span>
        }
      </button>

      <button
        type="button"
        class="action-btn"
        (click)="downloadJson()"
        title="Scarica file JSON"
        aria-label="Scarica file JSON"
      >
        <app-icon name="external-link" [size]="12"></app-icon>
        <span class="btn-text">Esporta</span>
      </button>
    </div>
  </div>

  @if (!isCollapsed()) {
    <div class="code-container">
      <pre class="json-pre"><code>@for (token of tokens(); track $index) {@if (token.type === 'plain') {{{ token.text }}} @else {<span [class]="'json-' + token.type">{{ token.text }}</span>}}</code></pre>
    </div>
  }
</div>
