id: email_pipeline
documentType: EMAIL
steps:
  - id: email_inference
    type: model_inference
    model: "${ollama.email-model}"
    schema: schemas/email_info.json
    system_prompt: prompts/email-system.txt

  - id: email_validation
    type: field_validation
    on_failure:
      retry_step: email_inference
      max_retries: 2
      feedback: true
    validators:
      - field: email
        validator: email

  - id: roles_lookup
    type: tool
    tool: company_roles_lookup
    output_key: company_roles
    timeout_ms: 2000
    max_retries: 1
    retry_backoff_ms: 100

  - id: recipient_inference
    type: model_inference
    model: "${ollama.email-model}"
    schema: schemas/email_recipient_info.json
    system_prompt: prompts/email-recipient-system.txt
    inject_context:
      company_roles: company_roles
      extracted_info: step.email_inference.output
    merge_fields:
      - destinatario
      - ruoloDestinatario
      - motivoInstradamento

  - id: recipient_validation
    type: field_validation
    on_failure:
      retry_step: recipient_inference
      max_retries: 2
      feedback: true
    unvalidated:
      - destinatario
      - ruoloDestinatario
    catalog_validation:
      source: company_roles
      fields:
        - destinatario
        - ruoloDestinatario

actions:
  on_ok:
    - tool: send_email
      timeout_ms: 10000
      max_retries: 0
      args:
        document: "$result"
