spring.application.name=slm-orchestrator

spring.docker.compose.enabled=false

# Ollama local configuration
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
# Architettura "Single Base Model + Dynamic Per-Pipeline System Prompt":
# un unico modello base resta residente in RAM (un solo runner Ollama) e il System Prompt
# di ogni pipeline/router viene iniettato a runtime (vedi src/main/resources/prompts/).
ollama.base-model=${OLLAMA_BASE_MODEL:qwen2.5:3b-instruct-q8_0}
# Property per-pipeline mantenute per retrocompatibilità: di default puntano al modello base.
ollama.model=${OLLAMA_MODEL:${ollama.base-model}}
ollama.email-model=${OLLAMA_EMAIL_MODEL:${ollama.base-model}}
ollama.invoice-model=${OLLAMA_INVOICE_MODEL:${ollama.base-model}}
ollama.anagrafica-model=${OLLAMA_ANAGRAFICA_MODEL:${ollama.base-model}}
ollama.router-model=${OLLAMA_ROUTER_MODEL:${ollama.base-model}}
ollama.router-system-prompt=prompts/router-system.txt
# Modello di escalation opzionale (verificato al bootstrap se valorizzato)
ollama.escalation-model=${OLLAMA_ESCALATION_MODEL:}
# Parametri runtime: keep_alive mantiene il runner in RAM; num_ctx/repeat_penalty sostituiscono i PARAMETER dei Modelfile
ollama.keep-alive=${OLLAMA_KEEP_ALIVE:60m}
ollama.num-ctx=${OLLAMA_NUM_CTX:2048}
ollama.repeat-penalty=1.0
ollama.num-predict=${OLLAMA_NUM_PREDICT:400}
ollama.temperature=${OLLAMA_TEMPERATURE:0.0}
ollama.seed=${OLLAMA_SEED:42}
# ollama.num-thread=8
ollama.connect-timeout=10s
ollama.read-timeout=120s

# Scelta del Router: 'gemini', 'jev', oppure 'local-ollama'
router.type=${ROUTER_TYPE:local-ollama}

# Google AI Studio (Gemini Router)
gemini.api-key=${GEMINI_API_KEY:INSERISCI_QUI_LA_TUA_CHIAVE_GOOGLE_AI_STUDIO}
gemini.model=gemini-3.5-flash-lite
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout=10s

# Jev (TypeSafe AI) & Cloudflare Workers AI (Clef) System One Router
# Provider: 'typesafe' (Jev System One) oppure 'cloudflare' (Clef-flash / Clef su Workers AI)
jev.provider=${JEV_PROVIDER:typesafe}
jev.api-key=${JEV_API_KEY:${CLOUDFLARE_API_TOKEN:INSERISCI_QUI_LA_TUA_CHIAVE}}
jev.account-id=${CLOUDFLARE_ACCOUNT_ID:}
jev.model=${JEV_MODEL:}
jev.base-url=${JEV_BASE_URL:}
jev.timeout=10s

# Durata massima di elaborazione di una pipeline (include inferenza, retry ed escalation)
orchestrator.pipeline.max-duration-ms=60000

# Toggle per l'attivazione/disattivazione delle guardie simboliche deterministiche e della coerenza relazionale
orchestrator.guards.enabled=${ORCHESTRATOR_GUARDS_ENABLED:true}
orchestrator.coherence.enabled=${ORCHESTRATOR_COHERENCE_ENABLED:true}

# Se abilitato, include nei log i dati sensibili dell'input utente e i messaggi completi dei FieldError (default: false)
# orchestrator.logging.include-sensitive-values=false
